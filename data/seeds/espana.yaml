# en Liquipedia y Fortnite Tracker. Lo que pongas aquí manda sobre lo automático.
#
# Campos: name, kind (player | team | org | caster | creator | desconocido), aliases,
# country, region, team, city, x, youtube_channel_id, twitch, epic_name, liquipedia,
# ambiguous, verified.
#
# city: SOLO si el propio jugador lo ha hecho público (bio, entrevistas, Liquipedia).
# ambiguous: true cuando el nombre también es una palabra normal o una sigla
